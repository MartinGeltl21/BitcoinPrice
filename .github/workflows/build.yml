name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Checksum plugin
        working-directory: target
        run: sha256sum BitcoinPrice-2.3.0.jar > BitcoinPrice-2.3.0.jar.sha256
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: BitcoinPrice-2.3.0
          path: |
            target/BitcoinPrice-2.3.0.jar
            target/BitcoinPrice-2.3.0.jar.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Publish tested plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          task_version=$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("pom.xml").getroot().find("{http://maven.apache.org/POM/4.0.0}version").text)')
          test "$GITHUB_REF_NAME" = "v$task_version"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "BitcoinPrice-$task_version" --dir release-assets
          cd release-assets
          sha256sum --check "BitcoinPrice-$task_version.jar.sha256"
          cd ..
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "BitcoinPrice $task_version" --notes-file "docs/releases/$task_version.md" \
            "release-assets/BitcoinPrice-$task_version.jar" "release-assets/BitcoinPrice-$task_version.jar.sha256"
