name: BitcoinPrice
version: '${project.version}'
main: me.martingeltl.bitcoin.BitcoinPrice
api-version: '26.2'
author: Martin Geltl
description: Bitcoin-Kurse, persönliche Alarme, Anzeigen und ein virtuelles Portfolio
website: https://github.com/MartinGeltl21/BitcoinPrice
commands:
  btc:
    description: Bitcoin-Kurs, persönliche Einstellungen und Hilfe
    usage: /<command> help
  btchelp:
    description: Zeigt alle verfügbaren BitcoinPrice-Befehle
    usage: /<command>
  btceur:
    description: Zeigt den Bitcoin-Kurs in Euro
    usage: /<command>
  btcusd:
    description: Zeigt den Bitcoin-Kurs in US-Dollar
    usage: /<command>
permissions:
  bitcoinprice.use:
    description: Bitcoin-Kurse und persönliche Funktionen verwenden
    default: true
  bitcoinprice.admin:
    description: Globale Einstellungen, Kursaktualisierung und Kurstafeln verwalten
    default: op
