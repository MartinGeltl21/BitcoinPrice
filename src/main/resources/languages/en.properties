help.player.1=/btc — show the current Bitcoin price
help.player.2=/btc price — show the current Bitcoin price
help.player.3=/btceur — show the Bitcoin price in EUR
help.player.4=/btcusd — show the Bitcoin price in USD
help.player.5=/btc help [Page] — this help; default page: 1
help.player.6=/btchelp [Page] — identical help; default page: 1
help.player.7=/btc interval — view chat interval and actionbar DEFAULT
help.player.8=/btc currency — view your effective currency (console: global)
help.player.9=/btc currency <Currency|BOTH|DEFAULT> — set your currency
help.player.10=/btc on — enable your selected price messages
help.player.11=/btc off — disable your price messages; alerts remain separate
help.player.12=/btc settings — view saved and effective settings
help.player.13=/btc status — view price cache, API cooldown and effective display; no API request
help.player.14=/btc display chat — show prices in chat
help.player.15=/btc display actionbar — show prices above the hotbar
help.player.16=/btc display actionbar continuous — always visible; refreshed from cache every second
help.player.17=/btc display actionbar interval [1|5|10|30|60|DEFAULT] — briefly show at your chosen minute interval
help.player.18=/btc display off — disable regular price display
help.player.19=/btc locale <Language-tag|DEFAULT> — choose number format, e.g. de-DE or en-US
help.player.20=/btc language <de|en|AUTO|DEFAULT> — choose text language; AUTO follows Minecraft, DEFAULT follows the server
help.player.21=/btc alert above <Amount> <Currency> — save an alert for an upward crossing
help.player.22=/btc alert below <Amount> <Currency> — save an alert for a downward crossing
help.player.23=/btc alert list — view your alerts and IDs
help.player.24=/btc alert remove <ID> — delete your alert (unique short ID supported)
help.player.25=/btc sats <Amount> <Currency> — show the equivalent in whole satoshis
help.player.26=/btc history [1h|6h|24h|7d] — saved prices; default: 24h
help.player.27=/btc board list — list price board names
help.player.28=Alerts are explicit: /btc off and disabling global chat do not disable them.
help.player.29=/btc portfolio — view your virtual balance and BTC
help.player.30=/btc portfolio start — open a learning portfolio with 10,000 virtual EUR; no reset
help.player.31=/btc portfolio buy <EUR-Amount> — buy virtual BTC at the current EUR price
help.player.32=/btc portfolio sell <BTC-Amount> — sell virtual BTC at the current EUR price
help.player.33=Currencies: {0}. Use a decimal point for amounts, e.g. 10.50.
help.player.34=BOTH shows EUR and USD together; alerts and satoshi conversion require a single currency.
help.player.35=DEFAULT inherits the global choice; /btc locale inherits the global number format.
help.player.36=Portfolio: virtual money only, optional learning activity; no real purchases. Trading requires a current price.
help.admin.1=/btc interval <1|5|10|30|60> — change chat interval and actionbar DEFAULT in minutes (OP/Admin)
help.admin.2=/btc global currency <Currency|BOTH> — change the global currency (OP/Admin)
help.admin.3=/btc global language <de|en|AUTO> — change the global language (OP/Admin)
help.admin.4=/btc refresh — update within API limits and send to eligible chat recipients (OP/Admin)
help.admin.5=/btc on all — enable global chat messages (OP/Admin)
help.admin.6=/btc off all — disable global chat messages; personal actionbar/alerts remain separate (OP/Admin)
help.admin.7=/btc board create [Name] — create a board at your position; default: spawn (OP/Admin)
help.admin.8=/btc board remove <Name> — remove a board (OP/Admin)
help.admin.9=/btc player <Name|UUID> settings — view player settings (OP/Admin)
help.admin.10=/btc player <Name|UUID> on — enable a player's price messages (OP/Admin)
help.admin.11=/btc player <Name|UUID> off — disable a player's price messages (OP/Admin)
help.admin.12=/btc player <Name|UUID> currency <Currency|BOTH|DEFAULT> — change a player's currency (OP/Admin)
help.admin.13=/btc player <Name|UUID> display <chat|actionbar|off> — change a player's display (OP/Admin)
help.admin.14=/btc player <Name|UUID> display actionbar continuous — always visible for a player (OP/Admin)
help.admin.15=/btc player <Name|UUID> display actionbar interval [1|5|10|30|60|DEFAULT] — personal minute interval (OP/Admin)
help.admin.16=/btc player <Name|UUID> locale <Language-tag|DEFAULT> — change a player's number format (OP/Admin)
help.admin.17=/btc player <Name|UUID> language <de|en|AUTO|DEFAULT> — change a player's language (OP/Admin)
help.admin.18=Player targets: exact known names or full UUIDs; saved while offline, no external profile lookup.
