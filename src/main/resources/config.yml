# BitcoinPrice 2.2 — bestehende Konfigurationen bleiben lesbar.
# Chat-Intervall und DEFAULT für persönliche Actionbar-Intervalle: 1, 5, 10, 30 oder 60 Minuten.
price-interval: 10
# EUR, USD, GBP, CHF, CAD, AUD, JPY, CNY, INR oder BOTH (EUR + USD).
price-currency: EUR
broadcasts-enabled: true
# Zahlenformat; Spieler können ihre eigene Sprache auswählen.
locale: de-DE
# Überwacht nur aktive Actionbars/Alarme/Kurstafeln, ohne jeden Spieler abzufragen.
monitor-seconds: 60
# Actionbar: /btc display actionbar continuous oder interval [Minuten|DEFAULT].
# Dauerhafte Anzeige wird jede Sekunde aus dem Cache erneuert (keine HTTP-Anfragen).
# Der frühere Schlüssel actionbar-seconds wird ignoriert.
history-hours: 168
alert-cooldown-seconds: 300
api:
  url: 'https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=eur,usd,gbp,chf,cad,aud,jpy,cny,inr&precision=2&include_24hr_change=true&include_last_updated_at=true'
  timeout: 10000
  cache-seconds: 60
  max-stale-seconds: 300
  max-provider-age-seconds: 900
  refresh-cooldown-seconds: 30
  # Optional: Demo-Key wird als Header gesendet. Niemals im Repository speichern.
  # Alternativ Umgebungsvariable COINGECKO_DEMO_API_KEY verwenden.
  demo-api-key: ''
messages:
  prefix: '&6[BitcoinPrice] &r'
  price-color: '&6'
  api-error: '&cKurs momentan nicht verfügbar. Bitte versuche es später erneut.'
  price: 'Bitcoin: {price} {currency} | 24h: {change} | {status} | Abruf: {age} | Kursstand: {provider_age}'
  actionbar: '&6BTC {price} {currency} &7| 24h: {change} | {status}'
  alert: '&ePreisalarm: BTC {price} {currency} — {direction} {threshold}'
  board: "&6Bitcoin\n&f{price} {currency}\n&724h: {change}\n&7{status} | Kursstand: {provider_age}"
